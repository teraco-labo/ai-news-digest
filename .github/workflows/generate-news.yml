name: Generate AI News Digest

on:
  schedule:
    # 毎日 UTC 21:00 (JST 6:00 AM) に実行
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up ffmpeg
        # apt も johnvansickle ミラーも不安定なため、複数ソースのフォールバック方式で確実に取得
        run: |
          set -e
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✓ ffmpeg は既にインストール済み: $(ffmpeg -version | head -1)"
            exit 0
          fi
          echo "ffmpeg を取得します..."
          # 1) apt で試す（--fix-missing で 404 のパッケージを許容）
          sudo apt-get update -qq || true
          if sudo apt-get install -y --fix-missing ffmpeg 2>/dev/null && command -v ffmpeg >/dev/null 2>&1; then
            echo "✓ apt 経由で取得成功"
            ffmpeg -version | head -1
            exit 0
          fi
          # 2) 静的ビルドを直接ダウンロード（BtbN の GitHub Release）
          echo "apt 失敗 → 静的ビルドをダウンロード..."
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo install -m 0755 /tmp/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m 0755 /tmp/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          echo "✓ 静的ビルド経由で取得成功"
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Claude Code CLI
        # 記事の選別・日本語化を Max プランのサブスクリプション枠で動かすため。
        # CLAUDE_CODE_OAUTH_TOKEN（`claude setup-token` で発行）が未設定でも
        # ANTHROPIC_API_KEY の従量課金 API に自動フォールバックするので失敗させない。
        run: npm install -g @anthropic-ai/claude-code || echo "::warning::Claude Code CLI のインストールに失敗（API にフォールバックします）"

      - name: Check curation credentials
        # Secret が空だとキュレーションが黙って劣化するため、実行前にログへ明示する。
        # 値そのものは出さない（文字数のみ）。
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "✓ CLAUDE_CODE_OAUTH_TOKEN あり (${#CLAUDE_CODE_OAUTH_TOKEN} 文字)"
          else
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN が未設定です（サブスク枠は使われません）"
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "✓ CLAUDE_API_KEY あり (${#ANTHROPIC_API_KEY} 文字)"
          else
            echo "::warning::CLAUDE_API_KEY が未設定です（API フォールバックも使えません）"
          fi

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Generate news digest
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          # サブスクリプション枠（優先）: ローカルで `claude setup-token` を実行して
          # 発行したトークンを Secrets に CLAUDE_CODE_OAUTH_TOKEN として登録する
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 従量課金 API（予備）: トークン未設定・CLI 失敗時に使われる
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GITHUB_TOKEN を渡すことで Python 内で push → 待機 → メール送信の順が保証される
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python generate_news.py --date "${{ github.event.inputs.date }}"
          else
            python generate_news.py
          fi

      # 既に知らせたものを実行間で覚えておく。これが無いと毎朝2日ぶんを見るせいで
      # 同じ請求を二度知らせてしまう。件名は入れず識別子だけなのでキャッシュで十分。
      - name: Restore billing watch memory
        uses: actions/cache@v4
        with:
          path: .billing-seen.json
          key: billing-seen-${{ github.run_id }}
          restore-keys: billing-seen-

      - name: Watch billing inbox (サブスクAPIチェッカー)
        # 課金の見張り。ダイジェスト本体とは独立させ、ここで失敗しても
        # 毎朝の配信は止めない（continue-on-error）。
        # 読むのはヘッダだけで、本文は取らず既読にもしない。
        # SMTP 用の App パスワードを IMAP 読み取りに流用するので新しい Secret は不要。
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # 台帳の本体は teraco.money 側。この2つが揃うと結果をそちらへ送る。
          # SYNC_TOKEN は teraco-money リポジトリの Secrets と同じ値を登録する
          SUBSCHECK_URL: ${{ secrets.SUBSCHECK_URL }}
          SYNC_TOKEN: ${{ secrets.SUBSCHECK_SYNC_TOKEN }}
        run: python billing_watch.py --days 2 --notify
